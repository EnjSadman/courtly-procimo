services:
  db:
    image: postgres:16
    container_name: courtly-postgres
    environment:
      POSTGRES_USER: courtly
      POSTGRES_PASSWORD: courtly
      POSTGRES_DB: courtly
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtly -d courtly"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - courtly-postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - sh
      - -c
      - npx prisma db push --schema=prisma/schema.prisma && node prisma/seed.js
    environment:
      DATABASE_URL: postgresql://courtly:courtly@db:5432/courtly
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://courtly:courtly@db:5432/courtly
      JWT_SECRET: change-me-in-production
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: production
      PORT: 4000
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  courtly-postgres-data:
